name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. A small monthly commit keeps Discovery running.
on:
  schedule:
    - cron: "41 3 1 * *"   # 03:41 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: monthly keepalive [skip ci]" || echo "nothing to commit"
          git push
