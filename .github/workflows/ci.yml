name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database-and-worker:
    name: Database access rules + worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_WORKER_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations and run access-control tests
        run: bash supabase/tests/run_tests.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker
        run: pip install -e "worker[dev]"

      - name: Worker tests (unit + end-to-end as discovery_worker)
        env:
          WORKER_TEST_DATABASE_URL: postgresql://discovery_worker:ci-test-only@localhost:5432/scholarship_finder_test
          WORKER_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scholarship_finder_test
        working-directory: worker
        run: python -m pytest tests -v

  web:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  privacy:
    name: Privacy boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_privacy_boundaries.py
