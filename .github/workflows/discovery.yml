name: Discovery

on:
  schedule:
    # 18:17 UTC = 02:17 Asia/Manila, daily. Off the hour to avoid GitHub's busiest minute.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./worker
      - name: Heartbeat
        env:
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          WORKER_CONTACT: ${{ vars.WORKER_CONTACT }}
        run: |
          if [ -z "$WORKER_DATABASE_URL" ]; then
            echo "::warning::WORKER_DATABASE_URL secret is not set yet; skipping (see README, step 4)."
            exit 0
          fi
          python -m scholarship_worker heartbeat
