[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-worker"
version = "0.1.0"
description = "Background discovery worker for Scholarship Finder (runs on GitHub Actions)."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scholarship-worker = "scholarship_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
